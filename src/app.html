<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			(() => {
				const PREFS_KEY = 'proxmoxai_prefs';
				const DEFAULT_PREFS = {
					theme: 'midnight',
					color_scheme: 'system',
					locale: 'vi',
					density: 'comfortable',
					reduced_motion: false,
					sidebar_collapsed: false
				};
				const LIGHT_VARIANTS = {
					anthropic: 'anthropic-light',
					v0: 'vercel-light',
					'github-dim': 'github-light'
				};
				const LIGHT_THEMES = new Set([
					'light',
					'sakura',
					'sepia',
					'paper',
					'arctic',
					'pastel-dream',
					'porcelain',
					'platinum',
					'spring',
					'summer',
					'minimal-light',
					'stripe',
					'notion',
					'vercel-light',
					'github-light',
					'anthropic-light'
				]);
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const systemPrefersLight = () =>
					window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

				function loadPrefs() {
					try {
						const raw = localStorage.getItem(PREFS_KEY);
						if (raw) return Object.assign({}, DEFAULT_PREFS, JSON.parse(raw));
						const legacy = localStorage.getItem('theme');
						if (legacy === 'light')
							return Object.assign({}, DEFAULT_PREFS, { theme: 'light', color_scheme: 'light' });
						if (legacy === 'system')
							return Object.assign({}, DEFAULT_PREFS, { theme: 'system', color_scheme: 'system' });
						if (legacy === 'her')
							return Object.assign({}, DEFAULT_PREFS, { theme: 'rosepine', color_scheme: 'dark' });
						if (legacy === 'oled-dark')
							return Object.assign({}, DEFAULT_PREFS, { theme: 'terminal', color_scheme: 'dark' });
					} catch (_) {}
					return Object.assign({}, DEFAULT_PREFS);
				}

				function resolveTheme(prefs) {
					let theme = prefs.theme || DEFAULT_PREFS.theme;
					const scheme = resolveColorScheme(prefs);
					if (theme === 'system') theme = systemPrefersLight() ? 'light' : 'midnight';
					if (scheme === 'light' && LIGHT_VARIANTS[theme]) theme = LIGHT_VARIANTS[theme];
					return theme;
				}

				function resolveColorScheme(prefs) {
					const rawScheme = prefs.color_scheme || DEFAULT_PREFS.color_scheme;
					return rawScheme === 'system' ? (systemPrefersLight() ? 'light' : 'dark') : rawScheme;
				}

				function applyPrefs(prefs, persist) {
					const root = document.documentElement;
					const theme = resolveTheme(prefs);
					const isLight = resolveColorScheme(prefs) === 'light';
					const mergedPrefs = Object.assign({}, DEFAULT_PREFS, prefs);
					root.setAttribute('data-theme', theme);
					root.setAttribute('data-density', mergedPrefs.density);
					root.lang = mergedPrefs.locale;
					if (prefs.reduced_motion) root.setAttribute('data-motion', 'reduced');
					else root.removeAttribute('data-motion');
					root.classList.toggle('light-mode', isLight);
					root.classList.toggle('light', isLight);
					root.classList.toggle('dark', !isLight);
					root.classList.remove('her');
					try {
						localStorage.setItem('theme', isLight ? 'light' : 'dark');
					} catch (_) {}
					if (persist) {
						try {
							localStorage.setItem(PREFS_KEY, JSON.stringify(mergedPrefs));
						} catch (_) {}
					}
					if (metaThemeColorTag)
						metaThemeColorTag.setAttribute('content', isLight ? '#ffffff' : '#171717');
					try {
						window.dispatchEvent(
							new CustomEvent('vnso:theme-change', {
								detail: Object.assign({}, mergedPrefs, { resolved_theme: theme })
							})
						);
					} catch (_) {}
					return { theme, isLight };
				}

				let prefs = loadPrefs();
				const resolved = applyPrefs(prefs, false);
				window.__getThemePrefs = () =>
					Object.assign({}, DEFAULT_PREFS, prefs, {
						resolved_theme: resolveTheme(prefs),
						resolved_scheme: resolveColorScheme(prefs)
					});
				window.__setTheme = (id) => {
					prefs = Object.assign({}, prefs, { theme: id || 'midnight' });
					applyPrefs(prefs, true);
				};
				window.__setColorScheme = (scheme) => {
					prefs = Object.assign({}, prefs, { color_scheme: scheme || 'system' });
					applyPrefs(prefs, true);
				};
				window.__setLocale = (locale) => {
					prefs = Object.assign({}, prefs, { locale: locale || 'vi' });
					applyPrefs(prefs, true);
				};

				const preloadHref = resolved.isLight ? '/static/splash.png' : '/static/splash-dark.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				if (window.matchMedia) {
					const media = window.matchMedia('(prefers-color-scheme: dark)');
					const onSystemChange = () => {
						if (prefs.theme === 'system' || prefs.color_scheme === 'system')
							applyPrefs(prefs, false);
					};
					if (media.addEventListener) media.addEventListener('change', onSystemChange);
					else if (media.addListener) media.addListener(onSystemChange);
				}

				const isDarkMode = !resolved.isLight;

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<title>Công nghệ VNSO | Giải pháp Cloud Server & Máy chủ</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		#splash-screen {
			background: #fff;
		}

		html.dark #splash-screen {
			background: #000;
		}

		html.her #splash-screen {
			background: #983724;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: none;
		}

		#progress-bar {
			display: none;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #progress-background {
			display: block;
		}

		html.her #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
	</style>
</html>
