name: Vnso Build & Deploy

on:
  push:
    branches:
      - vnso  # Chỉ chạy khi có code mới trên nhánh vnso
  workflow_dispatch: # Cho phép chạy thủ công

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  # Image sẽ có tên: ghcr.io/trinhtanphat/open-webui
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Cấp quyền ghi vào GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=vnso
            type=sha,prefix=git-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: open-webui-vnso:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint python open-webui-vnso:smoke -c "import uvicorn, fastapi; print('uvicorn=', uvicorn.__version__); print('fastapi=', fastapi.__version__)"

      - name: Tag and push verified image
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag"
              docker tag open-webui-vnso:smoke "$tag"
              docker push "$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

      # # Nếu sau này muốn build thêm CUDA song song, mình gợi ý:
      # - name: Build & push CUDA image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: true
      #     tags: ghcr.io/${{ env.IMAGE_NAME }}:vnso-cuda
      #     build-args: |
      #       USE_CUDA=true
      #       BUILD_HASH=${{ github.sha }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }} # Token để VPS login vào GHCR (xem hướng dẫn bên dưới)
          USERNAME: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }} # Private Key SSH

          command_timeout: 300m

          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_PAT,USERNAME
          script: |
            set -e

            # 1. Login vào GHCR trên VPS (để kéo image về)
            # Lưu ý: Image trên GHCR mặc định là Private, cần login mới kéo được
            echo "Login to GHCR..."
            echo $GHCR_PAT | docker login ghcr.io -u $USERNAME --password-stdin

            # 2. Định nghĩa tên Image (chữ thường)
            IMAGE_TAG="ghcr.io/${USERNAME}/open-webui:vnso"
            CONTAINER_NAME="open-webui-vnso"

            # 3. Pull image mới nhất
            echo "Pulling image..."
            timeout 20m docker pull $IMAGE_TAG

            # 4. Xóa container cũ (nếu có)
            echo "Removing old container if exists..."
            if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
                echo "Removing existing container..."
                docker stop -t 10 $CONTAINER_NAME || true
                docker rm $CONTAINER_NAME
            fi

            # 5. Chạy container mới
            # Cần map volume data để không mất dữ liệu khi update
            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p 3000:8080 \
              -v open-webui-data:/app/backend/data \
              $IMAGE_TAG

            # 6. Dọn dẹp image cũ cho sạch ổ cứng
            echo "Pruning old images..."
            docker image prune -f